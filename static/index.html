<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="不读取内容的数字手感与应用强度观察器">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/fonts/lxgw-wenkai-screen/lxgwwenkaiscreen.css">
  <link rel="stylesheet" href="/fonts/lxgw-wenkai/lxgw-wenkai.css">
  <title>扣舷-数字节律</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="offline-indicator" id="offline-indicator">正在连接扣舷-数字节律后台…</div>

  <div class="wrap">
    <!-- Header -->
    <div class="header">
      <div class="title-area window-drag">
        <div class="logo" aria-hidden="true"><img src="/icon-192.png" alt=""></div>
        <div class="brand-copy"><h1>扣舷-数字节律</h1><span>看见你的数字手感</span></div>
      </div>
      <button class="tool-btn" onclick="openSupport()" title="支持扣舷" aria-label="支持扣舷">
        <svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.4-8.8 10.1-8.8 10.1S3.2 14.1 3.2 8.7A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6z"/></svg>
      </button>
      <button class="tool-btn" data-action="insights" onclick="openMimoInsights()" title="手感回放" aria-label="手感回放">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
      </button>
      <button class="tool-btn" onclick="openSettings()" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </button>
      <button class="window-btn" onclick="windowControl('minimize')" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 24 24"><path d="M7 12h10"/></svg>
      </button>
      <button class="window-btn close" onclick="windowControl('close')" title="隐藏到托盘" aria-label="隐藏到托盘">
        <svg viewBox="0 0 24 24"><path d="M8 8l8 8M16 8l-8 8"/></svg>
      </button>
    </div>

    <!-- 下拉刷新指示器 -->
    <div class="pull-to-refresh" id="pull-to-refresh">
      <span class="loading-spinner"></span>
      <span style="margin-left: 8px">刷新中...</span>
    </div>

    <!-- Today handfeel -->
    <div class="today-card">
      <div class="date-board"><button class="date-nav" id="date-prev" type="button" title="前一天" aria-label="前一天">‹</button><button class="date-today" id="today-date" type="button" onclick="focusToday()" title="聚焦今天" aria-label="聚焦今天"></button><button class="date-nav" id="date-next" type="button" title="后一天" aria-label="后一天">›</button></div>
      <div class="today-score"><b id="today-score">—</b></div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon g"><svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M7 10h.01M10 10h.01M13 10h.01M16 10h.01M8 14h8"/></svg></div><div class="stat-label" id="key-stat-label">键盘</div><div class="stat-val green" id="v-keys">—</div></div>
      <div class="stat-card"><div class="stat-icon m"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6v6a6 6 0 0 1-12 0V9a6 6 0 0 1 6-6z"/><path d="M12 7v4"/></svg></div><div class="stat-label" id="clicks-stat-label">点击</div><div class="stat-val amber" id="v-clicks">—</div></div>
      <div class="stat-card"><div class="stat-icon s"><svg viewBox="0 0 24 24"><path d="M12 20V6"/><path d="M8 10l4-4 4 4"/><path d="M8 14l4 4 4-4"/></svg></div><div class="stat-label" id="scroll-stat-label">滚轮</div><div class="stat-val violet" id="v-scroll">—</div></div>
      <div class="stat-card"><div class="stat-icon t"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><path d="M21 12a9 9 0 1 1-9-9"/></svg></div><div class="stat-label" id="time-stat-label">前台时长</div><div class="stat-val teal" id="v-time">—</div></div>
    </div>

    <!-- Hour heatmap -->
    <div class="heat-card">
      <div class="heat-head">
        <div class="heat-title">
          <div class="dot-sm"></div>
          <h2 class="heat-label" aria-label="键盘鼠标热力图">
            <span class="heat-toggles" aria-label="热力图数据选择">
              <label class="heat-toggle"><input type="checkbox" id="heat-keyboard" checked onchange="renderHeatmap()"><span>键盘</span></label>
              <label class="heat-toggle"><input type="checkbox" id="heat-mouse" checked onchange="renderHeatmap()"><span>鼠标</span></label>
            </span><span class="heat-label-static">热力图</span>
          </h2>
          <span class="heat-now-text" id="heat-now-text"></span>
        </div>
      </div>
      <div class="heat-wrap">
        <div class="heat-days" id="heat-hours-labels"></div>
        <div class="heat-body">
          <div class="heat-hours" id="heat-day-labels"></div>
          <div class="heat-grid" id="heat-grid"></div>
        </div>
        <div class="heat-weekdays" id="heat-weekday-labels"></div>
      </div>
      <div class="heat-foot">
        <span class="heat-range"><button type="button" id="heat-week-btn" class="active" onclick="setHeatRange('week')">周</button><button type="button" id="heat-month-btn" onclick="setHeatRange('month')">月</button><button type="button" id="heat-year-btn" onclick="setHeatRange('year')">年</button></span>
        <span class="heat-period-nav" id="heat-period-nav"><button type="button" id="heat-period-prev" onclick="changeHeatPeriod(-1)" aria-label="上一周期" title="上一周期">‹</button><button type="button" id="heat-period-next" onclick="changeHeatPeriod(1)" aria-label="下一周期" title="下一周期">›</button></span>
        <div class="heat-legend"><span id="lg-less">less</span><div class="lg-cells" id="heat-lg"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span id="lg-more">more</span></div>
      </div>
    </div>

    <!-- App ranking -->
    <div class="app-section">
      <div class="sec-head"><div class="dot-sm" style="background:var(--primary)"></div><h2>应用强度榜</h2><div class="spacer"></div><span style="font-size:10px;color:var(--text4)" id="app-count"></span></div>
      <div class="app-list" id="app-list"><div class="empty">等待数据…</div></div>
    </div>
  </div>

  <div class="update-toast" id="update-toast" hidden>
    <div class="update-copy">
      <b id="update-toast-title">发现新版本</b>
      <span id="update-toast-sub">可以稍后安装</span>
    </div>
    <div class="update-actions">
      <button class="update-mini-btn primary" onclick="openPendingUpdate()">查看</button>
      <button class="update-mini-btn" onclick="dismissUpdateToast()">稍后</button>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modal-card">
      <div class="modal-head">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-head-extra" id="modal-head-extra"></div>
        <button class="modal-close" onclick="closeModal()" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</script>
</body>
</html>
