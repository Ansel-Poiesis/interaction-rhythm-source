name: Bug report
description: Report a reproducible defect without sharing private activity data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not attach databases, logs, screenshots, exports, email addresses, API keys, OAuth data, or personal activity records. Use the private security report for suspected vulnerabilities.
  - type: input
    id: app-version
    attributes:
      label: Application version
      description: Include the application version and source tag if known.
      placeholder: 0.12.1 / epoch 2, source tag v0.1.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or non-private examples.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: frequency
    attributes:
      label: Frequency
      placeholder: Every time, sometimes, or happened once
    validations:
      required: false
